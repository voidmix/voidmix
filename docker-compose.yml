services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: voidmix
      POSTGRES_PASSWORD: voidmix
      POSTGRES_DB: voidmix
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voidmix']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ['voidmix-postgres:/var/lib/postgresql/data']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:1420,http://tauri.localhost,tauri://localhost
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['voidmix-minio:/data']
  bucket-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/voidmix
  mailpit:
    image: axllent/mailpit:v1.26.1
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  voidmix-postgres:
  voidmix-minio:
