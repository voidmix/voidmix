# Set this service's Railway config path to /apps/web/railway.toml.
# Keep the Railway Root Directory at the repository root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = ["/apps/web/**", "/packages/**", "/package.json", "/bun.lock", "/vite.config.ts"]

[deploy]
startCommand = "node --env-file-if-exists=/app/.env --enable-source-maps .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
