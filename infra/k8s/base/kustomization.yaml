apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is environment-neutral. An overlay supplies the namespace, image names and tags,
# public hosts, and the generated `voidmix-config` ConfigMap and `voidmix-secrets` Secret.
resources:
  - api.yaml
  - web.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: voidmix
    includeSelectors: false
