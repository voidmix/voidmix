apiVersion: apps/v1
kind: Deployment
metadata:
  name: voidmix-web
  labels:
    app.kubernetes.io/name: voidmix-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: voidmix-web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voidmix-web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: voidmix-web
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-to-server origin of the API Service. Kustomize does not rewrite names inside
            # values: patch this if an overlay adds a name prefix or suffix.
            - name: API_ORIGIN
              value: http://voidmix-api:3002
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          # /login renders without calling the API, so an API outage does not unschedule Web.
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: voidmix-web
  labels:
    app.kubernetes.io/name: voidmix-web
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: voidmix-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voidmix-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voidmix-web
