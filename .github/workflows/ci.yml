name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voidmix
          POSTGRES_PASSWORD: voidmix
          POSTGRES_DB: voidmix_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voidmix -d voidmix_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://voidmix:voidmix@127.0.0.1:5432/voidmix_e2e
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_BUCKET: voidmix
      TEST_S3_REGION: us-east-1
      TEST_S3_ACCESS_KEY_ID: voidmix
      TEST_S3_SECRET_ACCESS_KEY: voidmix-local-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run doctor --tools-only
      - run: bun run test:scripts
      - run: bun run test:logger
      - run: bun run test:api
      - run: bun run test:go
      - run: bun run test:cache
      - name: Start local S3 storage
        run: bun run storage:up
      - run: bun run test:storage
      - name: Stop local S3 storage
        if: always()
        run: bun run storage:down
      - run: bun run db:check
      - name: Check Expo dependency versions
        run: bun run check:mobile
      - name: Check Go formatting
        working-directory: apps/desktop
        run: test -z "$(gofmt -l .)"
      - run: bun run build
      - name: Build and check standalone CLI
        run: |
          bun run build:cli:binary
          ./apps/cli/build/voidmix --version
      - name: Install Playwright Chromium
        run: bun run test:e2e:install --with-deps
      - name: Run end-to-end tests
        run: bun run test:e2e
      - name: Build desktop application
        working-directory: apps/desktop
        run: bun run build:native -skip-build-command -skip-installer -platform linux/amd64
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
