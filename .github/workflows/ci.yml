name: CI

on:
  pull_request:
  push:
    branches: [canary]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The same command a contributor runs before opening a pull request:
      # policy, format, lint, per-workspace checks, tests, builds, and the Nitro
      # runtime probe. CI adds only what needs a clean git tree, a browser, or
      # another operating system.
      - run: bun run verify
      - run: git diff --exit-code # route trees must match the Start plugin's output
      - run: bun run generate
      - run: git diff --exit-code # Drizzle artifacts must be committed
      # The layer scripts are the only thing that exercises layer selection.
      # `bun run test` inside verify passes whether or not these filters match,
      # which is how a glob that selected nothing survived in twelve manifests.
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run test:component
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage"
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd e2e playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: true

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop check
      - run: bun run --cwd apps/desktop test
      - run: bun run --cwd apps/desktop tauri:build
