name: CI

on:
  pull_request:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voidmix_test
          POSTGRES_PASSWORD: voidmix_test
          POSTGRES_DB: voidmix_ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U voidmix_test -d voidmix_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://voidmix_test:voidmix_test@127.0.0.1:5432/voidmix_ci_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run generate
        env:
          # Generation validates the URL but never connects to a database.
          DATABASE_URL: postgres://voidmix:ci@example.invalid:5432/voidmix
      - run: bun run --cwd e2e playwright install --with-deps chromium
      # Both suites reset fixtures; run them sequentially in the disposable DB.
      - name: Test PostgreSQL and browsers
        run: |
          bun run test:postgres
          bun run test:e2e
        env:
          NODE_ENV: test
      - name: Check generated files
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      # beforeBuildCommand already checks and builds the frontend.
      - run: bun run --cwd apps/desktop tauri:build
