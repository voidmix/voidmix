name: voidmix-deploy

x-build: &build
  context: .
  dockerfile: Dockerfile

x-database: &database
  DATABASE_URL: postgresql://voidmix:${POSTGRES_PASSWORD:?Run bun run docker:init first}@postgres:5432/voidmix

x-storage: &storage
  S3_ENDPOINT: http://s3:9000
  S3_BUCKET: ${S3_BUCKET:-voidmix}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-voidmix}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run bun run docker:init first}
  S3_PREFIX: ${S3_PREFIX:-app}

services:
  web:
    image: ${DOCKER_IMAGE_PREFIX:-voidmix}-web:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: web
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:3002
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${DOCKER_IMAGE_PREFIX:-voidmix}-api:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: api
    restart: unless-stopped
    environment:
      <<: [*database, *storage]
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public Web origin in deploy/.env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run bun run docker:init first}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run bun run docker:init first}@redis:6379/0
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: ${DOCKER_IMAGE_PREFIX:-voidmix}-migrate:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: migrate
    restart: "no"
    environment:
      <<: *database
    depends_on:
      postgres:
        condition: service_healthy

  storage-init:
    image: ${DOCKER_IMAGE_PREFIX:-voidmix}-storage-init:${IMAGE_TAG:-local}
    build:
      <<: *build
      target: storage-init
    restart: "no"
    environment:
      <<: *storage
    depends_on:
      s3:
        condition: service_healthy

  # Optional: set COMPOSE_PROFILES=proxy and PROXY_WEB_DOMAIN in deploy/.env for automatic HTTPS.
  proxy:
    profiles: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PROXY_WEB_DOMAIN: ${PROXY_WEB_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys must survive container replacement.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  # One-shot: `bun run docker:backup` writes a custom-format dump and exits.
  backup:
    profiles: [backup]
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: voidmix
      PGDATABASE: voidmix
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run bun run docker:init first}
    volumes:
      - ${BACKUP_DIR:-./deploy/backups}:/backups
    # Rename only after pg_dump succeeds so an interrupted run never leaves a plausible dump.
    command:
      - sh
      - -ec
      - |
        umask 077
        name="voidmix-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump --format=custom --no-owner --file="/backups/$$name.partial"
        mv "/backups/$$name.partial" "/backups/$$name"
        echo "Wrote $$name"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voidmix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bun run docker:init first}
      POSTGRES_DB: voidmix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidmix -d voidmix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run bun run docker:init first}
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-voidmix}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Run bun run docker:init first}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  s3-data:
  caddy-data:
  caddy-config:
